apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentflow
  labels:
    app: agentflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentflow
  template:
    metadata:
      labels:
        app: agentflow
    spec:
      containers:
        - name: agentflow
          image: agentflow-local:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"